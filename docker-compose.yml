# 로컬 실행 환경
#   npm run db:up     → SQL Server 2022만 (개발 서버 npm run dev용)
#   npm run local:up  → SQL Server + 운영과 같은 앱 이미지(Dockerfile)까지, http://localhost:3300
# 값은 모두 .env.local에서 읽는다 (--env-file .env.local). 이 파일에는 비밀값을 쓰지 않는다.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trippilot-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # .env.local 의 MSSQL_SA_PASSWORD 를 사용 (복잡도 규칙: 8자 이상, 대·소문자·숫자·기호 중 3종)
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?.env.local 에 MSSQL_SA_PASSWORD 를 설정하세요}
    ports:
      # 이 PC에서만 접속 (같은 네트워크의 다른 기기에 sa 계정 DB를 열지 않는다).
      # Node는 localhost를 ::1로 먼저 풀기 때문에 IPv6 루프백도 함께 연다
      - "127.0.0.1:1433:1433"
      - "[::1]:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 앱 DB가 없으면 만든다 (Azure SQL은 Bicep이 만들고, 컨테이너의 마이그레이션 실행기는 DB 생성은 하지 않는다)
  db-init:
    profiles: [app]
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      LOCAL_DB_NAME: ${LOCAL_DB_NAME:-trippilot}
    entrypoint:
      - /bin/sh
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID('$$LOCAL_DB_NAME') IS NULL CREATE DATABASE [$$LOCAL_DB_NAME]"
    restart: "no"

  # 운영과 같은 이미지: 시작 시 마이그레이션(scripts/migrate.mjs) → node server.js
  app:
    profiles: [app]
    build:
      context: .
      args:
        # 브라우저 공개 키는 빌드 시점에 번들에 들어간다
        NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY:-}
        NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID: ${NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
    image: trippilot:local
    container_name: trippilot-app
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file: .env.local
    environment:
      # .env.local의 DATABASE_URL(localhost)은 컨테이너 안에서 쓸 수 없으므로 compose 서비스 이름으로 바꾼다
      DATABASE_URL: sqlserver://mssql:1433;database=${LOCAL_DB_NAME:-trippilot};user=sa;password=${MSSQL_SA_PASSWORD};encrypt=true;trustServerCertificate=true
    ports:
      # 개발 서버(npm run dev, 3000)와 동시에 띄울 수 있도록 기본 3300.
      # 기본은 이 PC에서만 접속. 휴대폰 등 같은 네트워크 기기에서 열려면 .env.local에 LOCAL_APP_BIND=0.0.0.0
      - "${LOCAL_APP_BIND:-127.0.0.1}:${LOCAL_APP_PORT:-3300}:3000"
      - "[::1]:${LOCAL_APP_PORT:-3300}:3000"
    restart: unless-stopped

volumes:
  mssql-data:
